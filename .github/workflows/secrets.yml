name: Secret scanning

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The scan reads local history only, so it does not need the token.
          persist-credentials: false
      - name: Install pinned scanner
        # The release page's download answered 504 for hours on 8 November
        # 2026 while the same asset was served through the releases API, so
        # the download retries the release page within a time budget and
        # then asks the releases API for the asset by tag and name (gh
        # release download reads it through the API). The checksum pins the
        # content whichever path served it. The token only lifts the API's
        # unauthenticated rate limit; the asset is public.
        env:
          GH_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          out="$RUNNER_TEMP/gitleaks.tar.gz"
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          if ! curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 40 --retry 2 --retry-delay 3 --retry-max-time 100 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}" \
            --output "$out"; then
            echo "the release page did not serve the scanner; reading it through the releases API"
            timeout 120 gh release download "v${GITLEAKS_VERSION}" --repo gitleaks/gitleaks \
              --pattern "$asset" --output "$out" --clobber
          fi
          echo "$GITLEAKS_SHA256  $out" | sha256sum --check
          tar -xzf "$out" -C "$RUNNER_TEMP" gitleaks
      - name: Scan source and history without exposing values
        run: |
          "$RUNNER_TEMP/gitleaks" dir --redact --no-banner --config .gitleaks.toml .
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --config .gitleaks.toml --log-opts="--all" .
