name: Secret scanning

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The scan reads local history only, so it does not need the token.
          persist-credentials: false
      - name: Install pinned scanner
        # The release page's download answered 504 for hours on 8 November
        # 2026 while the same asset was served through the releases API, so
        # the download tries the release page three times and then the API
        # asset (the same file, id 378332058 of v8.30.1). The checksum pins
        # the content whichever path served it. The token only lifts the
        # API's unauthenticated rate limit; the asset is public.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/gitleaks.tar.gz"
          got=0
          for try in 1 2 3; do
            if curl --fail --silent --show-error --location \
              https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
              --output "$out"; then got=1; break; fi
            echo "release download failed (try $try)"; sleep 5
          done
          if [ "$got" != 1 ]; then
            echo "downloading the asset through the releases API instead"
            curl --fail --silent --show-error --location \
              --header "Accept: application/octet-stream" \
              --header "Authorization: Bearer $GH_TOKEN" \
              https://api.github.com/repos/gitleaks/gitleaks/releases/assets/378332058 \
              --output "$out"
          fi
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $out" | sha256sum --check
          tar -xzf "$out" -C "$RUNNER_TEMP" gitleaks
      - name: Scan source and history without exposing values
        run: |
          "$RUNNER_TEMP/gitleaks" dir --redact --no-banner --config .gitleaks.toml .
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --config .gitleaks.toml --log-opts="--all" .
