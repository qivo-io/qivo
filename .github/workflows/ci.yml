name: CI

on:
  pull_request:
  push:
    branches: ['**']
  # Run by hand from a branch to test a change to this workflow before it merges.
  workflow_dispatch:
  # Start CI (reviewed-ci.yml) calls this workflow to test one reviewed pull request commit.
  workflow_call:
    inputs:
      ref:
        description: Full commit SHA to test
        required: true
        type: string

# One in-flight run per ref; a new push supersedes the previous run. Start CI cancels its
# own obsolete builds, so each call gets a group of its own here.
concurrency:
  group: ${{ inputs.ref && format('ci-call-{0}', github.run_id) || format('ci-{0}', github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Keep the job name stable. Start CI's REQUIRED_JOBS (scripts/reviewed-ci.mjs) names it.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Hermetic: no deployment secrets, live contract reset or browser drives.
    steps:
      # Dependency install scripts run in this job, and no step needs the token. Without
      # `ref`, checkout uses the triggering event's commit.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # Start CI must test exactly the commit it authorized.
      - name: Confirm the requested commit
        if: inputs.ref
        env:
          EXPECTED: ${{ inputs.ref }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"

      # Start CI limits this job to reading the cache, so pull request code cannot save one.
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install
        run: npm ci

      - name: Install desktop runtime dependencies
        run: npm run desktop:install

      # Biome reports advisory warnings without failing the gate.
      - name: Lint and format (biome)
        run: npx biome ci .

      - name: Lint (oxlint)
        run: npm run lint

      - name: UI component and styling conventions
        run: npm run check:ui

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Typecheck frontend core (strict)
        run: npm run typecheck:strict

      # The root project does not cover the entire backend or the desktop shell.
      - name: Typecheck backend (convex, strict)
        run: npm run typecheck:convex

      - name: Typecheck desktop (strict)
        run: npm run typecheck:desktop

      - name: Build
        run: npm run build

      # Includes the Convex function-surface manifest and wrapper checks.
      - name: Test
        run: npm test -- --maxWorkers=2
