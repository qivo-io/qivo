name: CI

on:
  pull_request:
  push:
    branches: [main]

# One in-flight run per ref; a new push supersedes the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    # The repository variable CI_RUNNER names the runner, such as boat-large
    # for a Boat sandbox (https://docs.boat.dev/ci). Without it, the jobs
    # run on GitHub's runner. A pull request from a fork always does, since
    # Boat refuses a run by a user who is not on the account's list.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    # A slow runner can run every test file several times slower than
    # usual, and a job stopped at its limit cancels main CI and skips the
    # staging deploy. 25 minutes lets such a runner finish and still stops a
    # hung job.
    timeout-minutes: 25

    # Hermetic: no deployment secrets, live contract reset or browser drives.
    steps:
      # Dependency install scripts run in this job, and no step needs the token.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          check-latest: true
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Check the Node version
        run: node scripts/node-version.mjs

      - name: Install
        run: npm ci

      - name: No tracked agent instruction files
        run: npm run check:agent-files

      - name: Install desktop runtime dependencies
        run: npm run desktop:install

      - name: Installed dependencies match the lockfiles
        run: npm run check:dependencies

      # biome ci runs the formatter and every lint rule, so the gate runs
      # oxlint alone after it. A warning fails the gate as an error does.
      - name: Lint and format (biome)
        run: npx biome ci . --error-on-warnings

      - name: Lint (oxlint)
        run: npm run lint:oxlint

      - name: UI component and styling conventions
        run: npm run check:ui

      - name: Every TypeScript file in a typecheck
        run: npm run check:typecheck

      - name: Typecheck frontend core (strict)
        run: npm run typecheck:strict

      # The root project does not cover the entire backend or the desktop shell.
      # This also checks that the default-runtime code uses no Node global,
      # and that only convex/model/descriptions.ts writes task rows and their
      # descriptions (scripts/check-task-writes.mjs).
      - name: Typecheck backend (convex, strict)
        run: npm run typecheck:convex

      - name: Typecheck desktop (strict)
        run: npm run typecheck:desktop

      - name: Typecheck tests and tooling (Node, strict)
        run: npm run typecheck:node

      # The build typechecks the frontend before it bundles.
      - name: Typecheck frontend and build
        run: npm run build

  tests:
    name: tests (${{ matrix.shard }}/4)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          check-latest: true
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Check the Node version
        run: node scripts/node-version.mjs

      - name: Install
        run: npm ci

      - name: Install desktop runtime dependencies
        run: npm run desktop:install

      # scripts/vercel-routing.test.mjs checks the built pages only when
      # dist/ exists.
      - name: Build
        run: npm run build

      # Includes the Convex function-surface manifest and wrapper checks.
      - name: Test
        run: npm test -- --maxWorkers=4 --shard=${{ matrix.shard }}/4

  # Keep the published check name stable.
  quality:
    # A required check that is skipped counts as passed, so this job also
    # runs, and fails, when a part failed or the run was cancelled.
    if: ${{ always() }}
    needs: [static, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part passed
        if: ${{ needs.static.result != 'success' || needs.tests.result != 'success' }}
        run: exit 1
