name: CI

on:
  pull_request:
  push:
    branches: ['**']

# One in-flight run per ref; a new push supersedes the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Keep the published check name stable.
  quality:
    runs-on: ubuntu-latest
    # The job takes 5 to 9 minutes. A slow runner ran every test file about
    # four times slower and hit the old 15-minute limit with every test so
    # far passing, which cancelled main CI and skipped the staging deploy.
    # 25 minutes lets such a runner finish and still stops a hung job.
    timeout-minutes: 25

    # Hermetic: no deployment secrets, live contract reset or browser drives.
    steps:
      # Dependency install scripts run in this job, and no step needs the token.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install
        run: npm ci

      - name: Install desktop runtime dependencies
        run: npm run desktop:install

      # A warning fails the gate as an error does.
      - name: Lint and format (biome)
        run: npx biome ci . --error-on-warnings

      - name: Lint (biome and oxlint)
        run: npm run lint

      - name: UI component and styling conventions
        run: npm run check:ui

      - name: Every TypeScript file in a typecheck
        run: npm run check:typecheck

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Typecheck frontend core (strict)
        run: npm run typecheck:strict

      # The root project does not cover the entire backend or the desktop shell.
      # This also checks that the default-runtime code uses no Node global.
      - name: Typecheck backend (convex, strict)
        run: npm run typecheck:convex

      - name: Typecheck desktop (strict)
        run: npm run typecheck:desktop

      - name: Typecheck tests and tooling (Node, strict)
        run: npm run typecheck:node

      - name: Build
        run: npm run build

      # Includes the Convex function-surface manifest and wrapper checks.
      - name: Test
        run: npm test -- --maxWorkers=2
