name: Cancel obsolete Start CI

# A push, close or return to draft makes a Start CI build of the pull request's previous
# head obsolete. This job joins that build's concurrency group, which cancels it, and
# Start CI then marks the old commit's reviewed-ci status as an error. Builds of the new
# head are in another group and keep running. The job runs no repository code and its
# token has no permissions.
on:
  pull_request:
    types: [synchronize, closed, converted_to_draft]

permissions: {}

jobs:
  cancel:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    # Must equal the build job's group in reviewed-ci.yml for runs dispatched from main.
    # A push names the replaced head in `before`; the other events keep the head.
    concurrency:
      group: reviewed-ci-build-refs/heads/main-${{ github.event.pull_request.number }}-${{ github.event.before || github.event.pull_request.head.sha }}
      cancel-in-progress: true
    steps:
      - run: echo "Cancelled any Start CI build of the commit this event replaced."
