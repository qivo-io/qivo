name: Deploy staging

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  # Run by hand from main to restage after a private website merge. It deploys
  # the current public main with the current private main.
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  deployments: write

jobs:
  staging:
    if: >-
      github.repository == 'qivo-io/qivo' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      environment: staging
      app_revision: ${{ github.event.workflow_run.head_sha || github.sha }}
