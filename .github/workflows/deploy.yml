name: Deploy application

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      app_revision:
        required: true
        type: string

permissions:
  contents: read
  actions: read
  deployments: write

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.QIVO_APP_ORIGIN }}
    steps:
      # Deployment tooling comes from protected main. Application source is
      # selected separately by exact SHA through the Vercel Git-source API.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Verify release conditions and deploy exact revisions
        env:
          GH_TOKEN: ${{ github.token }}
          QIVO_ENVIRONMENT: ${{ inputs.environment }}
          QIVO_COMMIT: ${{ inputs.app_revision }}
          QIVO_SITE_REVISION: ${{ vars.QIVO_SITE_REVISION }}
          QIVO_APP_ORIGIN: ${{ vars.QIVO_APP_ORIGIN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_APP_PROJECT_ID: ${{ vars.VERCEL_APP_PROJECT_ID }}
          VERCEL_SITE_PROJECT_ID: ${{ vars.VERCEL_SITE_PROJECT_ID }}
          VERCEL_DEMO_PROJECT_ID: ${{ vars.VERCEL_DEMO_PROJECT_ID }}
          VERCEL_APP_TOKEN: ${{ secrets.VERCEL_APP_TOKEN }}
          VERCEL_SITE_TOKEN: ${{ secrets.VERCEL_SITE_TOKEN }}
          VERCEL_DEMO_TOKEN: ${{ secrets.VERCEL_DEMO_TOKEN }}
          VERCEL_APP_PROTECTION_BYPASS: ${{ secrets.VERCEL_APP_PROTECTION_BYPASS }}
        run: node scripts/deploy-environment.mjs
