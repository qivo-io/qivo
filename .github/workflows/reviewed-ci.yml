name: Start CI

# Runs full CI for one pull request commit whose reviews are finished, and publishes the
# reviewed-ci status that branch protection requires. Follow the review process in
# AGENTS.md, then dispatch it from main:
#
#   gh workflow run reviewed-ci.yml --ref main -f pr=NUMBER -f sha=HEAD_SHA
#
# The authorize and report jobs run scripts/reviewed-ci.mjs from this workflow's commit
# and never run pull request code. The build job runs the pull request commit with a
# read-only token, no secrets and read-only cache access. Dispatched from another branch,
# this workflow is a rehearsal of that branch's version and publishes
# "reviewed-ci (rehearsal)", which branch protection ignores.
run-name: Start CI for #${{ inputs.pr }} at ${{ inputs.sha }}

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: number
      sha:
        description: Full head commit SHA whose reviews you finished
        required: true
        type: string

permissions: {}

# One run per commit at a time, because the commit has one reviewed-ci status. A second
# request waits for the first run to finish, then finds its result: it starts nothing
# after a success and builds again after a failure. A push that replaces the commit
# cancels the run (reviewed-ci-cancel.yml).
concurrency:
  group: reviewed-ci-${{ github.ref }}-${{ inputs.sha }}
  cancel-in-progress: false

# Only the build job reads the cache. Nothing in this workflow saves one.
cache-mode: none

jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    outputs:
      build: ${{ steps.authorize.outputs.build }}
      sha: ${{ steps.authorize.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false
      - id: authorize
        name: Check the caller, commit, reviews and branch
        env:
          GH_TOKEN: ${{ github.token }}
          QIVO_PR: ${{ inputs.pr }}
          QIVO_SHA: ${{ inputs.sha }}
        run: node scripts/reviewed-ci.mjs authorize

  build:
    name: Build and test
    needs: authorize
    # A re-run would reuse the first attempt's authorization, so it never builds.
    if: needs.authorize.outputs.build == 'true' && github.run_attempt == '1'
    permissions:
      contents: read
    cache-mode: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.authorize.outputs.sha }}

  report:
    needs: [authorize, build]
    # always() also runs after a failed or cancelled build, so the status never stays
    # pending for a run that ended.
    if: always() && needs.authorize.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Check the build and everything again, then publish reviewed-ci
        env:
          GH_TOKEN: ${{ github.token }}
          QIVO_PR: ${{ inputs.pr }}
          QIVO_SHA: ${{ inputs.sha }}
        run: node scripts/reviewed-ci.mjs report
