<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Qivo</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<script>
// Restore only the theme before the first paint. Images still require the
// authenticated, current selection; no photo URL or private lease is cached.
// A cached choice of the retired Blue theme paints Dark, as the server reads it.
try {
  const stored = localStorage.getItem('qivo-appearance-mode');
  if (stored === 'dark' || stored === 'light' || stored === 'blue') {
    const mode = stored === 'light' ? 'light' : 'dark';
    document.documentElement.dataset.appearance = mode;
    document.documentElement.classList.toggle('dark', mode !== 'light');
    document.documentElement.style.colorScheme = mode;
  }
} catch {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
