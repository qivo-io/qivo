# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit reviews each change with its CLI before the pull request opens,
# as the maintainers' agent instructions say, so it does not review on
# GitHub by itself: no automatic review, status, progress message or reply to
# a comment that does not mention it. A comment that mentions @coderabbitai
# still gets an answer, so do not use one.
# Settings that only shape a review are left at their defaults, since the CLI
# may read this file too.
reviews:
  auto_review:
    enabled: false
    auto_incremental_review: false
    description_keyword: ""
    labels: []
  review_status: false
  review_progress: false
  commit_status: false
chat:
  auto_reply: false
